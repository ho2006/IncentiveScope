name: Research pipeline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python checks.py
      - run: python -m incentivescope analyze --config configs/demo.json --input data/sample/trades.csv --manifest data/sample/manifest.json --output reports/demo
  ml-checks:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[ml]'
      - run: |
          $env:MPLCONFIGDIR = Join-Path $env:RUNNER_TEMP 'incentivescope-matplotlib'
          python checks.py
  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, ml-checks]
    runs-on: windows-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: reports/gmx-stip
      - uses: actions/deploy-pages@v4
        id: deployment
