name: Research pipeline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python checks.py
      - run: python -m incentivescope analyze --config configs/demo.json --input data/sample/trades.csv --manifest data/sample/manifest.json --output reports/demo
