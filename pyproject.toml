[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "incentivescope"
version = "0.2.0"
description = "Reproducible on-chain incentive and repeat-trading research"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["duckdb==1.5.6"]

[project.optional-dependencies]
notebook = ["nbformat>=5.10,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]

[project.scripts]
incentivescope = "incentivescope.__main__:main"

[tool.setuptools.package-data]
incentivescope = ["*.sql", "*.graphql"]
